# Safety net: if the "Deploy site" run fails
# (usually a transient 500 on GitHub's side), re-run it once automatically.
name: Retry failed Pages deployment

on:
  workflow_run:
    workflows: ["Deploy site"]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3 }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait a minute, then re-run the failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          sleep 60
          # 7.10: if someone already re-ran it (or it is running / succeeded), do nothing - a failed
          # "cannot be retried" here only sent Oren a needless failure e-mail.
          state=$(gh run view "$RUN_ID" --repo "${{ github.repository }}" --json status,conclusion -q '.status + " " + .conclusion')
          echo "deploy run now: $state"
          if [ "$state" != "completed failure" ]; then echo "nothing to retry"; exit 0; fi
          gh run rerun "$RUN_ID" --failed --repo "${{ github.repository }}" || echo "rerun not possible - leaving it"
