<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kitchen Guide · Küche · Cuisine</title>
<meta name="robots" content="noindex, nofollow">
  <meta name="google" content="notranslate">
<style>
  :root { box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    --bg:#f7f7f4; --card:#ffffff; --ink:#1f2a2e; --muted:#5b6a70; --accent:#1b6b6d; --gold:#e8a33d; --warn:#fff3e0; --warnb:#e8a33d; --line:#e2e6e6; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#121818; --card:#1c2426; --ink:#eef2f2; --muted:#a7b3b6; --line:#2d3a3c; --warn:#3a2c14; } }
  :root[data-theme="dark"] { --bg:#121818; --card:#1c2426; --ink:#eef2f2; --muted:#a7b3b6; --line:#2d3a3c; --warn:#3a2c14; }
  html { scroll-padding-top: env(safe-area-inset-top,0px); }
  body { margin:0; background:var(--bg); color:var(--ink); font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height:1.55; }
  .wrap { max-width:720px; margin:0 auto; padding:16px 16px 48px; }
  header { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:8px 0 16px; }
  h1 { font-size:1.45rem; margin:0; }
  .lang { display:flex; gap:6px; }
  .lang button { border:1px solid var(--accent); background:transparent; color:var(--accent); border-radius:999px; padding:6px 14px; font-weight:600; cursor:pointer; }
  .lang button.on { background:var(--accent); color:#fff; }
  nav { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
  nav a { text-decoration:none; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 12px; font-size:.92rem; }
  section { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-bottom:14px; }
  h2 { font-size:1.15rem; margin:0 0 8px; color:var(--accent); display:flex; align-items:center; gap:8px; }
  h3 { font-size:1rem; margin:14px 0 4px; }
  ol, ul { margin:6px 0; padding-left:22px; }
  li { margin:4px 0; }
  .warn { background:var(--warn); border-left:4px solid var(--warnb); border-radius:8px; padding:10px 12px; margin:10px 0; }
  .ok { color:var(--accent); font-weight:600; }
  .no { color:#c0392b; font-weight:600; }
  table { width:100%; border-collapse:collapse; font-size:.93rem; }
  td, th { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  .muted { color:var(--muted); font-size:.9rem; }
  [data-l] { display:none; } html[data-lang="en"] [data-l="en"], html[data-lang="de"] [data-l="de"], html[data-lang="fr"] [data-l="fr"] { display:revert; }
  .back { display:inline-block; margin-bottom:6px; color:var(--accent); text-decoration:none; font-weight:600; font-size:.92rem; }
  @media print { .lang, nav { display:none; } section { break-inside:avoid; } }
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>
<script>
  var LANGS=['en','de','fr'];
  function setLang(l){ document.documentElement.setAttribute('data-lang',l); document.documentElement.lang=l;
    LANGS.forEach(function(x){ var b=document.getElementById('b-'+x); if(b) b.classList.toggle('on',x===l); });
    try{ localStorage.setItem('lang',l); }catch(e){} }
  // The guide itself is encrypted (../sealed/kitchen.bin); it opens with the guest key that the
  // personal link stored in this browser. Without it the page shows nothing about the home.
  (async function(){
    var wrap=document.getElementById('wrap'), k='';
    try{ k=localStorage.getItem('gk')||''; }catch(e){}
    try{
      if(!/^[A-Za-z0-9_-]{22}$/.test(k)) throw new Error('no key');
      var raw=Uint8Array.from(atob(k.replace(/-/g,'+').replace(/_/g,'/')),function(c){return c.charCodeAt(0);});
      var key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
      var r=await fetch('../sealed/kitchen.bin',{cache:'no-cache'}); if(!r.ok) throw new Error('fetch');
      var buf=new Uint8Array(await r.arrayBuffer());
      var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},key,buf.slice(12));
      wrap.innerHTML=new TextDecoder().decode(plain);
    }catch(e){
      wrap.innerHTML='<section><h2>Guests only</h2><p>This page is for guests. Open the link from your Airbnb message, then come back here.</p><p><a class="back" href="../">&larr; stayflorentin.com</a></p></section>';
      return;
    }
    // same language as the home guide: ?lang= from the link, else the saved choice, else the browser language
    var saved=new URLSearchParams(location.search).get('lang');
    try{ saved=saved||localStorage.getItem('lang'); }catch(e){}
    saved=saved||(navigator.language||'en').slice(0,2).toLowerCase();
    setLang(LANGS.indexOf(saved)>=0?saved:'en');
  })();
</script>
</body>
</html>
