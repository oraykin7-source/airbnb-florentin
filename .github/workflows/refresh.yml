name: Refresh guest guide

on:
  schedule:
    - cron: "0 17 * * 6"   # Saturday ~19:00-20:00 Israel time: weekly events refresh
    - cron: "0 5 * * 0"    # Sunday morning: retry only if Saturday's run failed
    - cron: "30 2 * * *"   # every night: update check-out dates only (no Claude cost)
  workflow_dispatch:
    inputs:
      mode:
        description: "full = events + stays, stays = calendar only"
        type: choice
        options: [full, stays]
        default: full

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - run: pip install -r agent/requirements.txt

      - name: Run agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AIRBNB_ICS_URL: ${{ secrets.AIRBNB_ICS_URL }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          if [ "${{ github.event.schedule }}" = "30 2 * * *" ] || [ "${{ inputs.mode }}" = "stays" ]; then
            python agent/refresh.py --stays
          else
            python agent/refresh.py
          fi

      - name: Commit updated data
        run: |
          git config user.name "guide-bot"
          git config user.email "guide-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh guest guide data ($(date -u +%F))"
            git push
          fi
