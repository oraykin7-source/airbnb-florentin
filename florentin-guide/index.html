<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Florentin Home Guide</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f6f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1916" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">F</span>
      <span class="brand-name" data-i18n="brand">Florentin Home Guide</span>
    </div>
    <div class="lang" role="radiogroup" aria-label="Language">
      <button type="button" role="radio" data-lang="en">EN</button>
      <button type="button" role="radio" data-lang="de">DE</button>
      <button type="button" role="radio" data-lang="fr">FR</button>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1 data-i18n="welcome">Welcome home</h1>
      <p class="stay" id="stay-line" hidden></p>
    </section>

    <nav class="jump" aria-label="Sections">
      <a href="#house" data-i18n="house_title">The apartment</a>
      <a href="#week" data-i18n="week_title">This week in Tel Aviv</a>
    </nav>

    <section id="house" class="block">
      <h2 data-i18n="house_title">The apartment</h2>
      <div class="cards" id="house-cards"></div>
    </section>

    <section id="week" class="block">
      <div class="week-head">
        <h2 data-i18n="week_title">This week in Tel Aviv</h2>
        <p class="muted" id="week-meta"></p>
      </div>
      <div class="tabs" role="tablist" id="cat-tabs">
        <button role="tab" data-cat="food" data-i18n="cat_food">Food &amp; restaurants</button>
        <button role="tab" data-cat="culture" data-i18n="cat_culture">Culture &amp; city events</button>
        <button role="tab" data-cat="nightlife" data-i18n="cat_nightlife">Nightlife &amp; parties</button>
      </div>
      <div class="events" id="events" role="tabpanel"></div>
    </section>
  </main>

  <footer class="foot">
    <p data-i18n="footer">Made with care by your host. Enjoy Florentin!</p>
  </footer>

  <script src="assets/app.js" defer></script>
</body>
</html>
